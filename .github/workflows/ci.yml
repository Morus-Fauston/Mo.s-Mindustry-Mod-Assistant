name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 固定具体版本：ubuntu-latest 自 2026-10-19 起逐步迁移到 Ubuntu 26.04，
    # 迁移期内系统变动会让 apt 依赖与离屏行为静默改变。升级时显式改这里并重跑验证。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libs (PySide6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          echo "STEP_APT_DONE"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies including legacy Qt tests
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[legacy-qt]' pytest
          echo "STEP_PIP_DONE"

      - name: Import smoke test
        run: |
          python -c "
          import os
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          from app.core.metadata import Metadata
          from pathlib import Path
          m = Metadata(Path('metadata'))
          print('smoke OK, instances:', len(m.list_instance_categories()))
          "
          echo "STEP_SMOKE_DONE"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q --tb=short
