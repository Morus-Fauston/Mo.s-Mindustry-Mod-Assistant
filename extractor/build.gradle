plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Mindustry core - locked to v159
    implementation 'com.github.Anuken.Mindustry:core:v159'

    // JSON output
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'dev.moma.extractor.Main'
}

// Allow passing output directory as argument: gradle run --args="--output ../metadata"
tasks.named('run') {
    standardInput = System.in
}

jar {
    manifest {
        attributes 'Main-Class': 'dev.moma.extractor.Main'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
