[project]
name = "moma"
version = "0.2.4.batch1"
description = "Mo's Mindustry Mod Assistant - GUI mod editor"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
]

[project.scripts]
moma = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
