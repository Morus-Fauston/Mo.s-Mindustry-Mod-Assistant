[project]
name = "moma"
version = "0.3.0a5"
description = "Mo's Mindustry Mod Assistant - GUI mod editor"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "pywebview>=6.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
legacy-qt = [
    "PySide6>=6.7",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
moma = "app.desktop.main:main"
moma-qt = "app.main:main"

# 明确只打包 app 包（含子包），避免 setuptools 自动发现到
# Docs/metadata/extractor 等顶层目录导致 editable 构建失败
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
